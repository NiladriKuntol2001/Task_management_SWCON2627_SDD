openapi: 3.0.3
info:
  title: StudyFlow API — Smart Student Task Manager (SDD v1)
  version: 1.0.0
  description: |
    REST API of the Smart Student Task Manager (SWCON 2026–27, SDD v1 build).
    Students manage assignments, exams and projects; the server scores every
    incomplete task and recommends what to work on next.

    **Authentication.** Every endpoint except `GET /health`, `POST /auth/register`
    and `POST /auth/login` needs `Authorization: Bearer <token>`. Tokens are
    HS256 JWTs valid for 8 hours (`STUDYFLOW_TOKEN_HOURS`). Sign-out revokes the
    token server-side (FR-03).

    **Priority formula (FR-11..FR-14).**
    `score = 0.5 × deadline_score + 0.3 × difficulty_score + 0.2 × time_score`
    * deadline_score: overdue or < 24 h → 100; ≤ 2 days → 75; ≤ 6 days → 50;
      ≤ 14 days → 25; otherwise 10 (days are rounded **up**, decision D1).
    * difficulty_score: Easy 20, Medium 50, Hard 80, Very Hard 100.
    * time_score: min(estimated_hours × 10, 100).
    * Shown score is rounded half-up; level from the shown score:
      ≥ 80 Critical, ≥ 60 High, ≥ 40 Medium, otherwise Low.
    * Order: exact score desc → earlier deadline → earlier creation (decision D2).

    **Errors.** Every error uses one shape (see `Error`): a human-readable
    `message` plus `fields`, a map from field name to what to fix (NFR-07).
    A task owned by another user returns **404**, never 403 (FR-21).

    Requirement IDs (FR-xx / NFR-xx) refer to `specs/001-student-task-manager/spec.md`.
  contact:
    name: SWCON2627 team — Zahra, Niladri, Khadija
    url: https://github.com/NiladriKuntol2001/Task_management_SWCON2627_SDD
servers:
  - url: http://localhost:8000/api
    description: Local development server (`python run.py`)
security:
  - bearerAuth: []

tags:
  - name: System
    description: Health check
  - name: Auth
    description: Register, sign in, sign out (FR-01..FR-03)
  - name: Tasks
    description: Task CRUD, filtering, sorting and completion (FR-04..FR-10, FR-15..FR-18, FR-21)
  - name: Priority
    description: Live priority preview for the task form (FR-11..FR-14, FR-35)
  - name: Dashboard
    description: Counts, priority mix and recommendation (FR-19, FR-20)
  - name: Profile
    description: View profile, change email and password (FR-22..FR-25)
  - name: Admin
    description: Admin panel — admins only, others get 403 (FR-26..FR-32)

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a student account and sign in
      description: Creates a **student** account and returns a session token (FR-01, FR-25).
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created; the user is signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadJson' }
        '409':
          description: Email already registered (compared ignoring case).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  message: An account with this email already exists.
                  fields: { email: An account with this email already exists. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and return a token
      description: Same 401 message for unknown email and wrong password, so accounts cannot be enumerated (FR-02).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401':
          description: Email or password is incorrect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Email or password is incorrect., fields: {} } }
        '403':
          description: Account has been deactivated by an admin (FR-30).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: This account has been deactivated. Please contact an administrator., fields: {} } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and revoke the current token
      operationId: logout
      responses:
        '204': { description: Signed out; the token no longer works (FR-03). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Tasks
  /tasks:
    get:
      tags: [Tasks]
      summary: List own tasks with filters and sorting
      description: |
        Returns only the caller's tasks (FR-21). When `view` is given, `status` and
        `sort` are ignored and the result is ordered by deadline (FR-17, FR-18).
        `subject` and `q` apply in every mode.
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, completed, all], default: active }
          description: Filter by completion status (FR-15).
        - name: sort
          in: query
          schema: { type: string, enum: [priority, deadline], default: priority }
          description: Sort order (FR-16). Completed tasks always come last under `priority`.
        - name: view
          in: query
          schema: { type: string, enum: [upcoming, overdue] }
          description: '`upcoming` = incomplete, not overdue, due within 7 days; `overdue` = incomplete and past deadline.'
        - name: subject
          in: query
          schema: { type: string }
          description: Exact subject match, ignoring case (FR-15).
        - name: q
          in: query
          schema: { type: string }
          description: Search text matched against the title, ignoring case (FR-15).
      responses:
        '200':
          description: Matching tasks plus the caller's subject list and counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Unknown `status`, `sort` or `view` value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Unknown sort order., fields: { sort: Use priority or deadline. } } }
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      description: The task is validated (FR-10, NFR-12) and returned with its computed priority (FR-04, FR-05, FR-11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/TaskValidationError' }

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get one task with its score breakdown
      operationId: getTask
      responses:
        '200':
          description: The task (FR-09). `priority` is null when completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
    put:
      tags: [Tasks]
      summary: Replace (edit) a task
      operationId: updateTask
      description: All five fields are required. The priority is recalculated on return (FR-06, FR-13).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422': { $ref: '#/components/responses/TaskValidationError' }
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      description: The UI asks for confirmation before calling this (FR-07).
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }

  /tasks/{task_id}/complete:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Mark a task complete or incomplete
      operationId: setTaskCompleted
      description: Completing sets `completed_at` and removes the priority; un-completing restores it (FR-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean, example: true }
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '422':
          description: '`completed` missing or not a boolean.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Say whether the task is completed., fields: { completed: Must be true or false. } } }

  # ---------------------------------------------------------------- Priority
  /priority/preview:
    post:
      tags: [Priority]
      summary: Preview the priority score without saving
      description: Used by the add/edit form for the live preview; same formula as stored tasks (FR-35). Nothing is saved.
      operationId: previewPriority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorityInput' }
      responses:
        '200':
          description: Score breakdown at the current server time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Priority' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Dashboard
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard figures and "What should I work on today?"
      operationId: getDashboard
      responses:
        '200':
          description: Counts, priority mix, recommendation, upcoming and overdue lists (FR-19, FR-20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Profile
  /me:
    get:
      tags: [Profile]
      summary: View own profile
      operationId: getProfile
      responses:
        '200':
          description: Profile with task counts (FR-22).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/email:
    patch:
      tags: [Profile]
      summary: Change email (requires current password)
      operationId: changeEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, current_password]
              properties:
                new_email: { type: string, format: email, maxLength: 254, example: new.address@abo.fi }
                current_password: { type: string, format: password, example: student123 }
      responses:
        '200':
          description: Email changed (FR-23).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The main admin's email cannot be changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Another account already uses this email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Another account already uses this email., fields: { new_email: Another account already uses this email. } } }
        '422':
          description: Invalid email, same as current email, or wrong/missing current password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Current password is incorrect., fields: { current_password: Current password is incorrect. } } }

  /me/password:
    patch:
      tags: [Profile]
      summary: Change password (requires current password)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password: { type: string, format: password, example: student123 }
                new_password: { type: string, format: password, minLength: 8, maxLength: 200, example: newSecret456 }
                confirm_password: { type: string, format: password, example: newSecret456 }
      responses:
        '204': { description: Password changed (FR-24). }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Wrong current password, new password too short / same as current, or confirmation mismatch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: Please fix the highlighted fields., fields: { confirm_password: "The two new passwords don't match." } } }

  # ---------------------------------------------------------------- Admin
  /admin/overview:
    get:
      tags: [Admin]
      summary: System overview
      operationId: adminOverview
      responses:
        '200':
          description: Totals, 14-day trend, level mix, top subjects and students needing attention (FR-27).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users with task statistics
      operationId: adminListUsers
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 'A number (optionally with `#`, e.g. `#7`) matches the user ID exactly; any other text matches name or email.'
      responses:
        '200':
          description: Users (FR-28).
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
    post:
      tags: [Admin]
      summary: Create a user (student or admin)
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RegisterRequest'
                - type: object
                  properties:
                    role: { type: string, enum: [student, admin], default: student }
      responses:
        '201':
          description: User created (FR-29).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '409':
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        example: 3
    patch:
      tags: [Admin]
      summary: Deactivate / reactivate a user or change role
      description: At least one of `is_active` or `role` is required. The main admin (ID 1) and the caller's own account cannot be changed (FR-26, FR-30).
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                is_active: { type: boolean, example: false }
                role: { type: string, enum: [student, admin] }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an admin, target is the main admin, or target is the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: "The main admin can't be deactivated or changed.", fields: {} } }
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { message: User not found., fields: {} } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/tasks:
    get:
      tags: [Admin]
      summary: All open tasks across users, in priority order
      operationId: adminListTasks
      parameters:
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/Level' }
        - name: owner_id
          in: query
          schema: { type: integer }
          description: Only tasks of this user.
      responses:
        '200':
          description: Open tasks with owner names (FR-31).
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Task'
                        - type: object
                          properties:
                            owner_name: { type: string, example: Aino Virtanen }
                  owner_name:
                    type: string
                    nullable: true
                    description: Name of `owner_id`'s user when that filter is used.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '422':
          description: Unknown level or non-numeric owner_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `/auth/login` or `/auth/register`. Expires after 8 hours or on sign-out.

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 12

  responses:
    BadJson:
      description: Body is not valid JSON or not a JSON object.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: The request body must be valid JSON., fields: {} } }
    Unauthorized:
      description: Missing, invalid, expired or revoked token, or the account is not active (NFR-04).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: Please sign in to continue., fields: {} } }
    AdminOnly:
      description: The caller is not an admin (FR-32).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: Admins only., fields: {} } }
    TaskNotFound:
      description: Task does not exist **or belongs to another user** (FR-21, NFR-05).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { message: Task not found., fields: {} } }
    ValidationError:
      description: One or more fields are invalid; nothing was saved (NFR-06, NFR-12).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              message: Please fix the highlighted fields.
              fields: { password: Password must be at least 8 characters. }
    TaskValidationError:
      description: Task fails the FR-10 rules; each failing field is named.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              message: Please fix the highlighted fields.
              fields:
                title: "Title can't be empty."
                estimated_hours: Estimated hours must be more than 0.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, fields]
          properties:
            message: { type: string, example: Please fix the highlighted fields. }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Field name → what to fix. Empty when the error is not about a field.

    Difficulty:
      type: string
      enum: [Easy, Medium, Hard, Very Hard]
    Level:
      type: string
      enum: [Critical, High, Medium, Low]

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Aino Virtanen }
        email: { type: string, format: email, maxLength: 254, example: aino@abo.fi, description: Stored lower-case; unique ignoring case. }
        password: { type: string, format: password, minLength: 8, maxLength: 200, example: student123 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: aino@abo.fi }
        password: { type: string, format: password, example: student123 }
    Session:
      type: object
      properties:
        token: { type: string, description: JWT (HS256), example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: integer, example: 3, description: Unique numeric ID, never reused (FR-25). }
        name: { type: string, example: Aino Virtanen }
        email: { type: string, format: email, example: aino@abo.fi }
        role: { type: string, enum: [student, admin] }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, example: '2026-10-01T09:00:00Z' }
        is_main_admin: { type: boolean, example: false, description: True only for user ID 1. }
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            task_count: { type: integer, example: 9 }
            completed_count: { type: integer, example: 4 }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            open: { type: integer, example: 5 }
            completed: { type: integer, example: 4 }
            overdue: { type: integer, example: 1 }
            top:
              type: integer
              nullable: true
              example: 83
              description: Highest shown score among the user's open tasks.

    PriorityInput:
      type: object
      required: [deadline, difficulty, estimated_hours]
      properties:
        deadline: { type: string, format: date-time, example: '2026-11-02T23:59:00Z' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        estimated_hours: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000, example: 6 }
    TaskInput:
      allOf:
        - type: object
          required: [title, subject]
          properties:
            title: { type: string, minLength: 1, maxLength: 200, example: Software Engineering report }
            subject: { type: string, minLength: 1, maxLength: 100, example: SWCON }
        - $ref: '#/components/schemas/PriorityInput'

    Priority:
      type: object
      description: Score breakdown at the current time (FR-09, FR-13).
      properties:
        score: { type: integer, example: 83, description: Shown score (exact rounded half-up). }
        exact: { type: number, example: 82.5, description: Unrounded score; used for ordering (D2). }
        level: { $ref: '#/components/schemas/Level' }
        days_left: { type: integer, example: 2, description: 0 under 24 h; negative when overdue. }
        overdue: { type: boolean, example: false }
        deadline_score: { type: integer, enum: [100, 75, 50, 25, 10], example: 75 }
        difficulty_score: { type: integer, enum: [20, 50, 80, 100], example: 100 }
        time_score: { type: number, maximum: 100, example: 60 }
        deadline_part: { type: number, example: 37.5, description: 0.5 × deadline_score }
        difficulty_part: { type: number, example: 30, description: 0.3 × difficulty_score }
        time_part: { type: number, example: 12, description: 0.2 × time_score }
    Task:
      type: object
      properties:
        id: { type: integer, example: 12 }
        owner_id: { type: integer, example: 3 }
        title: { type: string, example: Software Engineering report }
        subject: { type: string, example: SWCON }
        deadline: { type: string, format: date-time, example: '2026-11-02T23:59:00Z' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        estimated_hours: { type: number, example: 6 }
        completed: { type: boolean, example: false }
        completed_at: { type: string, format: date-time, nullable: true, example: null }
        created_at: { type: string, format: date-time, example: '2026-10-20T10:15:00Z' }
        overdue: { type: boolean, example: false, description: Incomplete and past deadline (FR-18). }
        priority:
          allOf: [ { $ref: '#/components/schemas/Priority' } ]
          nullable: true
          description: Null when the task is completed.
    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        subjects:
          type: array
          items: { type: string }
          example: [Finnish 1, SWCON, Thesis]
          description: All subjects the caller uses (for the filter menu).
        counts:
          type: object
          properties:
            active: { type: integer, example: 5 }
            completed: { type: integer, example: 4 }
            overdue: { type: integer, example: 1 }

    LevelMix:
      type: object
      properties:
        Critical: { type: integer, example: 1 }
        High: { type: integer, example: 2 }
        Medium: { type: integer, example: 1 }
        Low: { type: integer, example: 1 }
    Dashboard:
      type: object
      properties:
        counts:
          type: object
          properties:
            incomplete: { type: integer, example: 5 }
            completed: { type: integer, example: 4 }
            high_priority: { type: integer, example: 3, description: High + Critical }
            critical: { type: integer, example: 1 }
            overdue: { type: integer, example: 1 }
            due_this_week: { type: integer, example: 3 }
            completion_percent: { type: integer, example: 44 }
        mix: { $ref: '#/components/schemas/LevelMix' }
        recommendation:
          allOf: [ { $ref: '#/components/schemas/Task' } ]
          nullable: true
          description: '"What should I work on today?" — first incomplete task in priority order; null when nothing is open (FR-20).'
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/Task' }
          description: Incomplete, not overdue, due within 7 days, earliest first (FR-17).
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Task' }

    AdminOverview:
      type: object
      properties:
        students:
          type: object
          properties:
            total: { type: integer, example: 12 }
            active: { type: integer, example: 11 }
            deactivated: { type: integer, example: 1 }
        users_total: { type: integer, example: 14 }
        tasks:
          type: object
          properties:
            total: { type: integer, example: 96 }
            open: { type: integer, example: 58 }
            completed: { type: integer, example: 38 }
        completion_rate: { type: integer, example: 40, description: Percent of all tasks completed. }
        critical_open: { type: integer, example: 6 }
        overdue:
          type: object
          properties:
            tasks: { type: integer, example: 7 }
            students: { type: integer, example: 4 }
        trend:
          type: array
          description: Last 14 days, oldest first.
          items:
            type: object
            properties:
              date: { type: string, format: date, example: '2026-10-28' }
              created: { type: integer, example: 3 }
              completed: { type: integer, example: 2 }
        by_level: { $ref: '#/components/schemas/LevelMix' }
        top_subjects:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              subject: { type: string, example: SWCON }
              count: { type: integer, example: 18 }
        attention:
          type: array
          description: Students with overdue tasks, most urgent first.
          items:
            type: object
            properties:
              id: { type: integer, example: 5 }
              name: { type: string, example: Mikko Korhonen }
              overdue: { type: integer, example: 2 }
              open: { type: integer, example: 6 }
              task:
                type: object
                description: The student's highest-priority overdue task.
                properties:
                  title: { type: string }
                  deadline: { type: string, format: date-time }
                  score: { type: integer }
                  level: { $ref: '#/components/schemas/Level' }
